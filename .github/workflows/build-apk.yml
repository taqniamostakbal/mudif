name: Build Mudif APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        # v4: v3 fails on the removed legacy "tools" package ("Failed to find package 'tools'");
        # v4 drops it from the default packages and skips it if requested explicitly.
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mudif-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
