name: Build Mudif APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create/update the mudif-apk release
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        # v4: v3 fails on the removed legacy "tools" package ("Failed to find package 'tools'");
        # v4 drops it from the default packages and skips it if requested explicitly.
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK to release
        # Artifact storage quota (500 MB free plan) blocks actions/upload-artifact
        # once the meter fills; release assets do not count against that quota.
        # Rolling prerelease "mudif-apk" always holds the latest debug APK.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mudif-apk >/dev/null 2>&1 || gh release create mudif-apk --title "Mudif APK" --notes "Rolling debug APK build." --prerelease
          gh release upload mudif-apk app/build/outputs/apk/debug/app-debug.apk --clobber
