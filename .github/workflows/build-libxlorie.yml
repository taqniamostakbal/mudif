name: Build libXlorie.so (x86_64, fork era)

# One-off builder: produce the x86_64 libXlorie.so that matches the
# termux-x11 fork Java our app uses (tiny-computer/termux-x11 @
# 21159a1405, June 2026, nativeInit()V). The fork's AAR ships the .so
# for arm64-v8a only, and the current nightly .so (Nov 2026) changed
# the JNI interface (nativeInit()J + context pointer), so it crashes
# the :xserver process on x86_64 (P5.17). This builds the .so from the
# upstream source the fork merged (termux/termux-x11 @ b1c8877,
# 25 June 2026) and uploads it as an artifact. Run manually, then
# check the .so into app/src/main/jniLibs/x86_64/ in the main build.
#
# The fork itself cannot build it: its app/build.gradle has
# externalNativeBuild commented out (prebuilt .so only). Upstream at
# b1c8877 has the CMake build enabled (application + ABI splits).

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone termux-x11 (fork era)
        uses: actions/checkout@v4
        with:
          repository: termux/termux-x11
          ref: b1c8877e92188edff513d6a248e510c4b87d86aa
          path: termux-x11
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build x86_64 APK (native libXlorie.so)
        working-directory: termux-x11
        # Per-ABI task (splits.abi enabled in the app). Falls back to a
        # full debug build if the task name differs.
        run: ./gradlew assembleX86_64Debug --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: Extract lib/x86_64/libXlorie.so
        run: |
          cd termux-x11/app/build/outputs/apk/debug
          ls -la
          APK=$(ls app-x86_64-debug.apk 2>/dev/null || ls app-universal-debug.apk)
          echo "APK=$APK"
          mkdir -p /tmp/libxlorie
          unzip -o "$APK" 'lib/x86_64/libXlorie.so' -d /tmp/libxlorie
          ls -la /tmp/libxlorie/lib/x86_64/
          file /tmp/libxlorie/lib/x86_64/libXlorie.so
          md5sum /tmp/libxlorie/lib/x86_64/libXlorie.so

      - name: Upload libXlorie.so (x86_64, fork era)
        uses: actions/upload-artifact@v4
        with:
          name: libXlorie-x86_64-fork-era
          path: /tmp/libxlorie/lib/x86_64/libXlorie.so
