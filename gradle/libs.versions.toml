[versions]
agp = "8.5.2"
kotlin = "2.0.20"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
lifecycle = "2.8.6"
castFramework = "21.4.0"
mediarouter = "1.6.0"
snakeyaml = "2.3"
commonsCompress = "1.26.1"
terminalLib = "e7a15b7877"
constraintlayout = "2.1.4"
recyclerview = "1.3.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
snakeyaml = { group = "org.yaml", name = "snakeyaml", version.ref = "snakeyaml" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
# NetHunter PTY terminal (Tiny Container's Global.terminalSession).
# Same JitPack repo as termux-x11 (settings.gradle.kts). Pure Java, no
# Kotlin stdlib dependency expected; if CI reports stdlib metadata
# conflicts, apply the same exclude pattern as termux-x11 below.
terminal-lib = { group = "com.github.tiny-computer", name = "terminal-lib", version.ref = "terminalLib" }
# Phase 2 — Google Cast sender (live HLS, Default Media Receiver).
play-services-cast-framework = { group = "com.google.android.gms", name = "play-services-cast-framework", version.ref = "castFramework" }
# Phase 2 — route chooser dialog (MediaRouteChooserDialogFragment).
androidx-mediarouter = { group = "androidx.mediarouter", name = "mediarouter", version.ref = "mediarouter" }
# p28: ConstraintLayout for the agent chat tab (fragment_agent.xml).
# The weight-based LinearLayout did not render the chat UI on the rig.
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
# p30: pinned so ConcatAdapter.getWrappedAdapterAndPosition (1.3.0+)
# is always available for the Store's single-list span lookup.
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
